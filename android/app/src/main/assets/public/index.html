    <script>
      // Self-healing mechanism for Service Worker and Cache Storage issues (fixes blank screens on web)
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().then(function() {
                console.log('Unregistered stale service worker');
              });
            }
          }).catch(function(err) {
            console.error('Error unregistering service workers:', err);
          });
        }

        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              caches.delete(key).then(function() {
                console.log('Cleared stale cache: ' + key);
              });
            });
          }).catch(function(err) {
            console.error('Error clearing caches:', err);
          });
        }

        window.addEventListener('error', function(e) {
          var isChunkError = e.message && (
            e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            e.message.indexOf('Unexpected token') !== -1 ||
            e.message.indexOf('import') !== -1
          );
          var isScriptTagError = e.target && e.target.tagName === 'SCRIPT';
          
          if (isChunkError || isScriptTagError) {
            console.warn('Script loading error detected. Forcing reload to fetch fresh assets...', e);
            var reloadCount = parseInt(sessionStorage.getItem('shusto_reload_count') || '0', 10);
            if (reloadCount < 3) {
              sessionStorage.setItem('shusto_reload_count', (reloadCount + 1).toString());
              window.location.reload(true);
            }
          }
        }, true);
      })();
    </script>
