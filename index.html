<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Shusto - Your Telehealth Companion</title>
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shusto" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/HWMYLkGG/Image.jpg" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/HWMYLkGG/Image.jpg" />
    <script type="module">
      import RefreshRuntime from "/@react-refresh";
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script>
      // Safe cleanup of any stale Service Worker and Cache Storage
      (function() {
        try {
          if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                try {
                  registrations[i].unregister();
                } catch (e) {}
              }
            }).catch(function() {});
          }
        } catch (e) {}

        try {
          if (typeof window !== 'undefined' && 'caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(key) {
                try {
                  caches.delete(key);
                } catch (e) {}
              });
            }).catch(function() {});
          }
        } catch (e) {}
      })();

      // Catch any fatal loading error and show details instead of blank screen
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          console.error("Boot script error caught:", e.error || e.message);
          var msg = (e.error && e.error.message) || e.message || 'একটি স্ক্রিপ্ট লোড হতে সমস্যা হয়েছে।';
          root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;font-family:sans-serif;background:#fff1f2;color:#9f1239;">' +
            '<div style="width:48px;height:48px;background:#fef2f2;color:#ef4444;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem auto;font-weight:bold;font-size:24px;">!</div>' +
            '<h3 style="color:#0f172a;margin:0 0 0.5rem 0;font-size:18px;">অ্যাপ লোড হতে সমস্যা হয়েছে</h3>' +
            '<p style="color:#64748b;font-size:13px;line-height:1.5;margin:0 0 1.25rem 0;">' + msg + '</p>' +
            '<button onclick="window.location.reload()" style="background:#0ea5e9;color:white;border:none;padding:12px 20px;border-radius:12px;font-weight:bold;cursor:pointer;width:100%;font-size:14px;">আবার চেষ্টা করুন</button>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
